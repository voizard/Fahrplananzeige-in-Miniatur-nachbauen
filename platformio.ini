; PlatformIO-Projekt: Strassenbahn-Abfahrten auf dem LilyGO T-Display S3
;
; Board:  ESP32-S3R8, 16 MB Flash, 8 MB OPI-PSRAM, 1.9" ST7789 (170x320, IPS)
; Display: ueber 8-Bit-Parallelbus (Arduino_GFX, wie im LilyGO-Repo)

[env:lilygo-t-display-s3]
platform = espressif32@6.5.0
board = lilygo-t-display-s3
boards_dir = boards
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; OPI-PSRAM, 16-MB-Partitionsschema (3 MB App)
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; WICHTIG: GFX Library ist auf 1.6.0 festgenagelt (nicht ^, nicht 1.6.1).
; Diese Plattform (espressif32@6.5.0) liefert den Arduino-Core 2.0.x. Dazu
; passen nur GFX-Versionen mit dem Guard "ESP_ARDUINO_VERSION_MAJOR < 3".
;
;   ^1.4.9 / 1.6.2+  -> fatal error: esp32-hal-periman.h: No such file or directory
;                        (Header gibt es erst im Core 3.x)
;   1.6.1            -> error: 'esp_rgb_panel_t' was not declared in this scope
;                        (kaputter Guard im Header: "... >5" statt "< 3",
;                         dadurch wird das struct esp_rgb_panel_t nicht definiert,
;                         die .cpp nutzt es aber)
;   1.6.0            -> baut fehlerfrei (verifiziert, s.u.)
;
; 1.6.0 ist der letzte Stand, der mit Core 2.x sauber durchlaeuft.
; Verifiziert mit echtem Build: PlatformIO Core 6.2.0, espressif32@6.5.0,
; Ergebnis [SUCCESS], Flash 13.7 % (898657 B), RAM 14.0 %.
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.0
    bblanchon/ArduinoJson @ ^7.0.4
